name: music_transcriber
description: Convert audio recordings into sheet music.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^15.1.2

  # HTTP client
  dio: ^5.8.0+1

  # Audio recording
  flutter_sound: ^9.24.2

  # File import
  file_picker: ^10.1.9

  # MIDI playback
  flutter_midi_pro: ^3.1.6

  # WebView (for OSMD sheet music rendering)
  webview_flutter: ^4.11.0

  # File sharing & saving
  share_plus: ^11.0.0
  path_provider: ^2.1.5

  # Permissions
  permission_handler: ^11.4.0

  cupertino_icons: ^1.0.8
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.1
  build_runner: ^2.4.15

flutter:
  uses-material-design: true
  assets:
    - assets/osmd/
